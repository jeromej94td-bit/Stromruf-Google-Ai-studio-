name: One-shot phone sync patch

on:
  push:
    branches: ["fix/phone-customer-number-sync"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phone-customer-number-sync
          fetch-depth: 0
      - name: Apply patch
        run: python3 tools/apply_phone_customer_number_sync.py
      - name: Remove temporary patch files
        run: rm -f tools/apply_phone_customer_number_sync.py .github/workflows/oneshot-phone-customer-number-sync.yml
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: sync customer number when phone changes"
          git push origin HEAD:fix/phone-customer-number-sync
